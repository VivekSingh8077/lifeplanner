<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="MyLife Planner — a personal timetable and productivity dashboard." />
    <title>MyLife Planner</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var raw = localStorage.getItem('mylife-planner:v1');
        var theme = raw ? JSON.parse(raw).theme : 'system';
        var dark =
          theme === 'dark' ||
          ((theme === 'system' || !theme) && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
